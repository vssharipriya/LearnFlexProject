
services:
  - type: web
    name: learnflex-saathi
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LEARNFLEX_DATA_DIR
        value: /var/data
      - key: LEARNFLEX_RETENTION_DAYS
        value: "365"
